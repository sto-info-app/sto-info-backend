version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '18:00'
      timezone: 'Europe/London'
    open-pull-requests-limit: 10
    versioning-strategy: 'increase'
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
    groups:
      angular:
        patterns:
          - '@angular/*'
          - 'rxjs'
          - 'zone.js'
          - 'typescript'
      tooling:
        patterns:
          - '@types/*'
          - 'eslint*'
          - '@eslint/*'
          - 'prettier'
          - 'jest*'
          - '@jest/*'
          - '@testing-library/*'

  # GitHub Actions updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '18:00'
      timezone: 'Europe/London'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'github-actions'
