name: Contributors
on:
  push:
    branches: ['development']
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Sundays at 00:00 UTC

env:
  NODE_VERSION: 24

# Declare default permissions as none.
permissions: {}

jobs:
  update-contributors:
    name: Update Contributors
    runs-on: ubuntu-latest
    # Run only on the canonical repository
    if: github.repository_owner == 'sto-info-app' || github.event.repository.fork == false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GH_PAT_REPO_TOKEN || github.token }}
          fetch-depth: 0

      - name: Create branch for contributors update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH_NAME="chore/update-contributors-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Update .all-contributorsrc
        run: |
          # Install all-contributors CLI
          npm install -g all-contributors-cli

          # Get unique human contributors (excluding bots)
          # Format: name|login
          contributors=$(git log --format='%an|%al' | sort -u | grep -v '\[bot\]' | grep -v 'github-actions')

          while IFS='|' read -r name login; do
            echo "Processing $name ($login)..."
            # Try to add the contributor for 'code'. 
            # If they already exist, this will gracefully fail/warn but we continue.
            all-contributors add "$login" code || echo "$login already added or failed to add"
          done <<< "$contributors"

          # Generate/Update the contributors files
          all-contributors generate

      - name: Update Contributors (CONTRIBUTORS.md)
        uses: akhilmhdh/contributors-readme-action@83ea0b4f1ac928fbfe88b9e8460a932a528eb79f # v2.3.11
        with:
          image_size: 100
          readme_path: CONTRIBUTORS.md
          commit_message: |
            docs: update contributors

            Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT_REPO_TOKEN || github.token }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_REPO_TOKEN || github.token }}
        run: |
          # If there are any changes in the working directory
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "docs: update contributors [skip ci]" -m "Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            git push origin "$BRANCH_NAME"
            gh pr create \
              --title "docs: update contributors" \
              --body "Automated update for CONTRIBUTORS.md and .all-contributorsrc" \
              --label "chore" \
              --base development \
              --head "$BRANCH_NAME" || echo "PR already exists"
          else
            echo "No changes detected, skipping PR creation."
          fi
