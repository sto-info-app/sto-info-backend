name: Version bump on merge to development

on:
  push:
    branches: [development]
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - '.agent/**'
      - '.vscode/**'
      - 'LICENCE'

permissions: {}

env:
  NODE_VERSION: 24

concurrency:
  group: version-bump-development
  cancel-in-progress: true

jobs:
  bump_version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Development
    permissions:
      contents: write
      pull-requests: write
      actions: read

    # Hardening: prevent infinite loops and unnecessary runs
    if: |
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version to ') &&
      !contains(github.event.head_commit.message, 'Automated version bump from') &&
      !(contains(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, 'chore/bump-version-to'))

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies
        with:
          use-cache: true
          node-version: ${{ env.NODE_VERSION }}

      - name: Bump patch version and create PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_REPO_TOKEN }}
        run: |
          # Configure git to use the bot's identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          echo "Current version: $CURRENT_VERSION"

          # Bump patch without creating a git tag
          npm version patch --no-git-tag-version

          NEW_VERSION="$(node -p "require('./package.json').version")"
          echo "Bumped version: $NEW_VERSION"

          # Create a new branch for the version bump
          BRANCH_NAME="chore/bump-version-to-$NEW_VERSION"

          # Check if a PR already exists for this version
          EXISTING_PR=$(gh pr list --base development --head "$BRANCH_NAME" --json number --jq '.[0].number' || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for version $NEW_VERSION. Skipping."
            exit 0
          fi

          # Delete the remote branch if it exists from a previous failed run
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || echo "Branch $BRANCH_NAME does not exist remotely, continuing..."

          # Create the branch
          git checkout -b "$BRANCH_NAME"

          # Commit the changes
          git add package.json package-lock.json
          git commit -s -m "chore: bump version to $NEW_VERSION"

          # Push the branch
          git push origin "$BRANCH_NAME"

          # Create a pull request
          PR_URL=$(gh pr create \
            --title "chore: bump version to $NEW_VERSION" \
            --body "Automated version bump from $CURRENT_VERSION to $NEW_VERSION" \
            --base development \
            --head "$BRANCH_NAME")

          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"

      - name: Merge version bump
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_REPO_TOKEN }}
        run: |
          sleep 5
          gh pr merge "$PR_URL" \
            --repo "${{ github.repository }}" \
            --merge \
            --admin \
            --body "Automated version bump merge (bypassing review requirement)"
