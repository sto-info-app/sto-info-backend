name: Lint and Test

on:
  pull_request:
    branches:
      - development
      - 'epic/*'
      - production
    types: [opened, synchronize, reopened, ready_for_review]

  push:
    branches:
      - development
      - production

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: 24

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_test:
    # Don't run for draft PRs (but still run for pushes)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve cache toggle
        id: cache-toggle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          value=$(gh api repos/$REPO/actions/variables/CACHE_NODE_MODULES --jq '.value' 2>/dev/null || echo '')
          if [ -z "$value" ]; then
            value=true
          fi
          echo "use_cache=$value" >> "$GITHUB_OUTPUT"

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies
        with:
          use-cache: ${{ steps.cache-toggle.outputs.use_cache }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Linter
        run: npm run lint

      - name: Run Tests (with coverage)
        run: npm run test:cov

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        # Skip analysis for draft PRs and PRs from forks where secrets are unavailable
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.draft == false &&
           github.event.pull_request.head.repo.full_name == github.repository)

      - name: Build (push only)
        if: github.event_name == 'push'
        run: npm run build
