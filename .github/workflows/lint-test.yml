name: Lint and Test

on:
  pull_request:
    branches:
      - development
      - 'epic/*'
      - production
    types: [opened, synchronize, reopened, ready_for_review]

  push:
    branches:
      - development
      - production

permissions: {}

env:
  NODE_VERSION: 24

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      src_changed: ${{ steps.filter.outputs.src_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            src_changed:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'nx.json'
              - 'tsconfig.json'
              - 'jest.config.mjs'

  dependabot_note:
    needs: check_changes
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - name: Comment on Dependabot PR (private dependencies)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const commentLines = [
              "### CI skipped for Dependabot PRs",
              "",
              "This repository uses **private npm dependencies** (e.g. Font Awesome Pro)",
              "which require secrets that are **not available to Dependabot workflows**.",
              "",
              "For this reason:",
              "- Dependency installation, linting, tests, and builds are intentionally **skipped**",
              "- Dependency security is still covered by **Dependabot alerts**",
              "- Full CI runs for all human-authored PRs",
              "",
              "This behaviour is intentional and documented to avoid misleading CI failures."
            ];

            const commentBody = commentLines.join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number
            });

            const alreadyCommented = comments.some(c =>
              c.body.includes("CI skipped for Dependabot PRs")
            );

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: commentBody
              });
            }

  lint_and_test:
    name: 'Lint and Test'
    needs: check_changes
    # Skip if dependabot
    # Skip draft PRs
    # Skip version bump PRs
    # ONLY RUN if src_changed is true OR if it's a push (to keep badges updated)
    if: |
      github.actor != 'dependabot[bot]' &&
      (needs.check_changes.outputs.src_changed == 'true' || github.event_name == 'push') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve cache toggle
        id: cache-toggle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          value=$(gh api repos/$REPO/actions/variables/CACHE_NODE_MODULES --jq '.value' 2>/dev/null || echo '')
          if [ -z "$value" ]; then
            value=true
          fi
          echo "use_cache=$value" >> "$GITHUB_OUTPUT"

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies
        with:
          use-cache: ${{ steps.cache-toggle.outputs.use_cache }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Linter
        run: npm run lint

      - name: Run Tests (with coverage)
        run: npm run test:cov

      - name: Verify coverage exists
        run: test -f reports/coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: reports/coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: reports/junit/junit.xml
          report_type: test_results
          fail_ci_if_error: false

      - name: SonarQube Cloud Scan
        # Skip for Dependabot PRs (no code changes, avoids errors)
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: >
            -Dproject.settings=sonar-project.properties
            -Dsonar.javascript.lcov.reportPaths=reports/coverage/lcov.info
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/reports/**,**/*.spec.ts,**/*.test.ts
            -Dsonar.coverage.exclusions=src/main.ts,src/environments/**,src/database/migrations/**,src/**/index.ts,src/**/index.js,src/app.module.ts,src/**/*.module.ts,src/**/*.dto.ts,src/**/*.entity.ts,src/**/*.model.ts,src/**/*.models.ts,src/**/*.interface.ts,src/**/*.interfaces.ts,src/**/*.enum.ts,src/**/*.constant.ts,src/**/*.constants.ts,src/**/tests/**,src/**/test/**,src/**/__tests__/**,src/views/copy-email-templates-to-dist.js
            -Dsonar.issue.ignore.multicriteria=e1,e2
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1313
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/*.spec.ts,**/*.test.ts,**/__tests__/**,**/test/**,**/tests/**
            -Dsonar.issue.ignore.multicriteria.e2.ruleKey=secrets:S6684
            -Dsonar.issue.ignore.multicriteria.e2.resourceKey=**/*.spec.ts,**/*.test.ts,**/__tests__/**,**/test/**,**/tests/**

      - name: Summarize Results
        if: always()
        run: npm run summary:ci
        env:
          CI_SUMMARY_FILE: ci-summary.md

      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        with:
          message-path: ci-summary.md
          allow-repeats: true

      - name: Restore Stryker incremental cache
        # Only run on PRs, skip for Dependabot
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .stryker-tmp/incremental.json
          key: stryker-incremental-${{ github.base_ref }}-${{ hashFiles('src/**/*.ts') }}
          restore-keys: |
            stryker-incremental-${{ github.base_ref }}-
            stryker-incremental-

      - name: Run Incremental Mutation Testing
        # Only run on PRs, skip for Dependabot (not needed for dependency updates)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        shell: bash
        run: |
          # Fetch the base branch to compare against
          git fetch origin ${{ github.base_ref }} --depth=1

          # Compute and run incremental mutation testing (exits 0 when nothing to mutate)
          BASE_REF=origin/${{ github.base_ref }} npm run test:mutation:incremental

      - name: Build (push only)
        if: github.event_name == 'push'
        run: npm run build
