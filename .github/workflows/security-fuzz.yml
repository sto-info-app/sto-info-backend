name: 'Security: Fuzz'

on:
  pull_request:
    branches:
      - development
      - production
    types: [opened, synchronize, reopened, ready_for_review]

  schedule:
    # Weekly deep fuzz run every Monday at 03:00 UTC
    - cron: '0 3 * * 1'

  workflow_dispatch:
    inputs:
      fuzz_run_count:
        description: 'Number of fuzz test runs (default: 50 for PR, 1000 for weekly/manual)'
        required: false
        default: '1000'

permissions: {}

env:
  NODE_VERSION: 24

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      src_changed: ${{ steps.filter.outputs.src_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            src_changed:
              - 'src/**/*.ts'
              - 'package.json'
              - 'package-lock.json'

  fuzz:
    name: 'Security: Fuzz'
    needs: check_changes
    # Skip if code_changed is false (unless scheduled or push)
    if: |
      needs.check_changes.outputs.src_changed == 'true' || 
      github.event_name == 'schedule' || 
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve cache toggle
        id: cache-toggle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          value=$(gh api repos/$REPO/actions/variables/CACHE_NODE_MODULES --jq '.value' 2>/dev/null || echo '')
          if [ -z "$value" ]; then
            value=true
          fi
          echo "use_cache=$value" >> "$GITHUB_OUTPUT"

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies
        with:
          use-cache: ${{ steps.cache-toggle.outputs.use_cache }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Run lightweight fuzz tests (PR)
        if: github.event_name == 'pull_request'
        run: npm run test:fuzz
        env:
          FUZZ_NUM_RUNS: 50

      - name: Run deep fuzz tests (weekly/manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:fuzz:full
        env:
          FUZZ_NUM_RUNS: ${{ github.event.inputs.fuzz_run_count || '1000' }}

      - name: Summarize Results
        if: always()
        run: npm run summary:ci
        env:
          CI_SUMMARY_FILE: fuzz-summary.md

      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        with:
          message-path: fuzz-summary.md
          allow-repeats: true
