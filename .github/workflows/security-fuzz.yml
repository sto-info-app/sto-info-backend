name: 'Security: Fuzz'

on:
  pull_request:
    branches:
      - development
    types: [opened, synchronize, reopened, ready_for_review]

  schedule:
    # Weekly deep fuzz run every Monday at 03:00 UTC
    - cron: '0 3 * * 1'

  workflow_dispatch:
    inputs:
      fuzz_run_count:
        description: 'Number of fuzz test runs (default: 50 for PR, 1000 for weekly/manual)'
        required: false
        default: '1000'

permissions: {}

env:
  NODE_VERSION: 24

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      src_changed: ${{ steps.filter.outputs.src_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@de225aa2aa39c2c019d084ee9b80362f62762b33 # v3.0.2
        id: filter
        with:
          filters: |
            src_changed:
              - 'src/**/*.ts'
              - 'package.json'
              - 'package-lock.json'

  fuzz:
    name: 'Property-based fuzz testing'
    needs: check_changes
    # Skip if code_changed is false (unless scheduled or push)
    if: |
      needs.check_changes.outputs.src_changed == 'true' || 
      github.event_name == 'schedule' || 
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve cache toggle
        id: cache-toggle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          value=$(gh api repos/$REPO/actions/variables/CACHE_NODE_MODULES --jq '.value' 2>/dev/null || echo '')
          if [ -z "$value" ]; then
            value=true
          fi
          echo "use_cache=$value" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        if: steps.cache-toggle.outputs.use_cache == 'true'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: npm ci

      - name: Run lightweight fuzz tests (PR)
        if: github.event_name == 'pull_request'
        run: npm run test:fuzz
        env:
          FUZZ_NUM_RUNS: 50

      - name: Run deep fuzz tests (weekly/manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:fuzz:full
        env:
          FUZZ_NUM_RUNS: ${{ github.event.inputs.fuzz_run_count || '1000' }}
