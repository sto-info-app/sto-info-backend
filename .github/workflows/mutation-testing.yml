name: Mutation Testing (Full)

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  workflow_dispatch: # Allow manual trigger

permissions: {}

env:
  NODE_VERSION: 24.15.0

jobs:
  stryker_full:
    name: Full Mutation Analysis
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Full analysis instruments ~9k mutants, then the dry run loads that tree
    # in one Jest process. --concurrency 2 (1 checker + 1 test runner) is what
    # lets that dry run fit on a 16GB ubuntu-latest runner; it is slower than
    # the config default of 4, so this budget matches the frontend full job
    # rather than cancelling a run that would have finished.
    timeout-minutes: 240
    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies
        with:
          use-cache: true
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Stryker (Full)
        # concurrency 2 => 1 TypeScript checker + 1 test runner, so the dry run
        # does not start two instrumented Jest processes on a 16GB runner.
        # NODE_OPTIONS raises the parent Stryker process; testRunnerNodeArgs in
        # stryker.config.mjs raises the child workers to the same 8GB ceiling.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx stryker run --concurrency 2

      - name: Upload Mutation Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stryker-full-report
          path: reports/mutation/
          retention-days: 30
