name: Mutation Testing (Full)

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  workflow_dispatch: # Allow manual trigger
    inputs:
      force:
        description: Ignore the saved incremental results and test every mutant
        type: boolean
        default: false

permissions: {}

env:
  NODE_VERSION: 24.22.3
  # How many slices the mutate set is cut into. Changing it moves files
  # between shards and starts every shard's incremental results afresh, so
  # the next run is a slow one. See "Weekly full run" in
  # docs/github/QUALITY-AUTOMATION.md before changing it.
  SHARD_TOTAL: 6

jobs:
  stryker_shard:
    name: Full Mutation Analysis (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A GitHub-hosted job is stopped at 6 hours whatever this says, and one
    # job holding the whole mutate set outgrew that: from October 2026 every
    # weekly run was cancelled at 6 hours (12,364 mutants, 76% done at best),
    # and the Fleet Community merge doubles the set to ~520 files. Each shard
    # takes a fixed sixth of it, about 2.5 hours from cold, far less once its
    # incremental results are cached.
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 1 to SHARD_TOTAL. A matrix cannot read env, so keep the two in step.
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies
        with:
          use-cache: true
          node-version: ${{ env.NODE_VERSION }}

      # Last run's results for this shard. Stryker re-tests only the mutants
      # whose source or covering tests changed since, so a quiet week is
      # quick. The key changes with SHARD_TOTAL, because the files in each
      # shard do.
      - name: Restore incremental results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental
          key: stryker-incremental-v1-${{ env.SHARD_TOTAL }}-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: stryker-incremental-v1-${{ env.SHARD_TOTAL }}-${{ matrix.shard }}-

      - name: Run Stryker (shard)
        id: stryker
        # Its own budget, under the job's, so the steps below still run and
        # upload whatever there is when a shard overruns.
        timeout-minutes: 330
        # The script passes --concurrency 2 (1 TypeScript checker + 1 test
        # runner), so the dry run does not start two instrumented Jest
        # processes on a 16GB runner. NODE_OPTIONS raises the parent Stryker
        # process; testRunnerNodeArgs in stryker.config.mjs raises the child
        # workers to the same 8GB ceiling.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: node scripts/mutation-shards.mjs run ${{ matrix.shard }} "$SHARD_TOTAL" $FORCE

      - name: Save incremental results
        if: steps.stryker.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental
          key: stryker-incremental-v1-${{ env.SHARD_TOTAL }}-${{ matrix.shard }}-${{ github.run_id }}

      - name: Upload shard report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stryker-shard-${{ matrix.shard }}
          path: reports/mutation/
          retention-days: 7
          if-no-files-found: ignore

  stryker_merge:
    name: Full Mutation Analysis
    needs: stryker_shard
    # Merge whatever finished, so one shard overrunning still leaves a report
    # for the rest. The merge fails when a shard's report is missing.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # For the merged HTML report, which is built with the same
      # mutation-testing-elements bundle Stryker's html reporter uses.
      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies
        with:
          use-cache: true
          node-version: ${{ env.NODE_VERSION }}

      - name: Download shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: stryker-shard-*
          path: reports/shards

      - name: Merge shard reports
        run: node scripts/mutation-shards.mjs merge reports/shards reports/mutation "$SHARD_TOTAL"

      - name: Upload Mutation Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stryker-full-report
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: ignore
