name: OpenSSF Scorecard
on:
  schedule:
    - cron: '30 3 * * 0' # Sundays at 03:30 UTC
  push:
    branches: ['development']
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    # Run only on the canonical repository
    if: github.repository_owner == 'sto-info-app' || github.event.repository.fork == false
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge.
      id-token: write
      # Needed to access repository contents.
      contents: read
      # Needed to access actions.
      actions: read

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: 'Run analysis'
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to OpenSSF Scorecard API
          publish_results: true

      - name: 'Upload artifact'
        uses: actions/upload-artifact@4cedc5d8fe0a446d10e8cf356c6637ee8a042e4e # v4.6.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: 'Upload to code-scanning'
        uses: github/codeql-action/upload-sarif@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0 # v3.28.9
        with:
          sarif_file: results.sarif
