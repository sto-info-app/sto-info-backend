name: 'Security: ZAP (Dev API)'

on:
  push:
    branches:
      - development
    paths:
      - 'package.json'
      - 'package-lock.json'

  schedule:
    # Weekly scan every Monday at 03:00 UTC
    - cron: '0 3 * * 1'

  workflow_dispatch:
    inputs:
      zap_scan_type:
        description: 'ZAP scan type (baseline or full)'
        required: false
        default: 'full'

permissions: {}

env:
  NODE_VERSION: 24
  DEV_API_BASE_URL: 'https://dev-api.startrekonline.info'
  DEV_API_HEALTH_URL: 'https://dev-api.startrekonline.info/health/live'
  DEV_API_VERSION_URL: 'https://dev-api.startrekonline.info/version'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap:
    name: 'OWASP ZAP DAST scan (Dev API)'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.repository_owner == 'sto-info-app' &&
      (github.event_name != 'push' || 
        startsWith(github.event.head_commit.message, 'chore: bump version to ') ||
        contains(github.event.head_commit.message, 'Automated version bump from') ||
        (contains(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, 'chore/bump-version-to'))
      )
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Wait for deployment and verify version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          expected_version=$(node -p "require('./package.json').version")
          echo "Expected repo version: ${expected_version}"

          max_attempts=10
          delay=60

          for attempt in $(seq 1 $max_attempts); do
            echo "Attempt $attempt of $max_attempts: Checking deployed version..."

            # Perform a quick health check to signal status, but don't fail on 403
            status_hook=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: Mozilla/5.0" --proto '=https' --proto-redir '=https' "${DEV_API_HEALTH_URL}" --max-time 10 || echo "000")
            if [ "$status_hook" = "403" ]; then
              echo "::warning::403 Forbidden: Requests from GitHub Actions are being blocked. Allow GitHub Actions IP ranges for ${DEV_API_HEALTH_URL}."
            fi

            # Check actual version
            version_response=$(curl -sSL -w "\n%{http_code}" -H "User-Agent: Mozilla/5.0" --proto '=https' --proto-redir '=https' "${DEV_API_VERSION_URL}" --max-time 15 2>/dev/null || true)
            http_code=$(echo "${version_response}" | tail -n1)
            actual_version=$(echo "${version_response}" | sed '$d' | tr -d '\r\n')

            if [ "${http_code}" = "200" ] && [ -n "${actual_version}" ]; then
              if [ "${actual_version}" = "${expected_version}" ]; then
                echo "Success: Deployed version matches (${actual_version}). Proceeding to scan."
                exit 0
              fi
              echo "Version mismatch: expected ${expected_version}, found ${actual_version}."
            else
              echo "API or version endpoint unreachable (HTTP ${http_code})."
            fi

            if [ "${attempt}" -lt "${max_attempts}" ]; then
              echo "Waiting ${delay}s before next attempt..."
              sleep "${delay}"
            fi
          done

          echo "Error: Timed out waiting for version ${expected_version} to be deployed after 10 minutes."
          exit 1

      - name: Run ZAP baseline scan
        if: github.event_name == 'push' || github.event.inputs.zap_scan_type == 'baseline'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.DEV_API_HEALTH_URL }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-z "-config network.connection.defaultUserAgent=Mozilla/5.0" -a -j -m 3 -T 900'
          allow_issue_writing: false
          artifact_name: zap-baseline-report-dev-api

      - name: Run ZAP full scan
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.zap_scan_type == 'full')
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ env.DEV_API_BASE_URL }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-z "-config network.connection.defaultUserAgent=Mozilla/5.0" -a -j -m 3 -T 1800'
          allow_issue_writing: false
          artifact_name: zap-full-scan-report-dev-api
