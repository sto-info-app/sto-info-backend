name: 'CodeQL Static Analysis'

on:
  push:
    branches: ['development', 'production']
  pull_request:
    branches: ['development', 'production']
  schedule:
    - cron: '30 0 * * 1'

permissions: {}

jobs:
  check_changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      src_changed: ${{ steps.filter.outputs.src_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            src_changed:
              - 'src/**/*.ts'
              - 'package.json'
              - 'package-lock.json'

  code_scanning:
    name: 'CodeQL Analysis'
    needs: check_changes
    # Skip if no src changed (unless scheduled or push)
    if: |
      needs.check_changes.outputs.src_changed == 'true' || 
      github.event_name == 'schedule' || 
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect CodeQL default setup
        id: codeql-default-setup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          # If CodeQL "default setup" is enabled in the repo settings, GitHub will reject
          # SARIF uploads from advanced (workflow-based) configurations.
          # When that is the case, we skip this workflow so the default setup can run.
          state=''
          if state=$(gh api "repos/$REPO/code-scanning/default-setup" --jq '.state' 2>/dev/null); then
            if [ "$state" = "configured" ] || [ "$state" = "enabled" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
            fi
            echo "state=$state" >> "$GITHUB_OUTPUT"
          else
            # If we cannot query the default setup state (permissions/API hiccup), be conservative
            # and skip advanced CodeQL to avoid failing the workflow.
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "state=unknown" >> "$GITHUB_OUTPUT"
          fi

      # Initialises the CodeQL tools for scanning.
      - name: Initialise CodeQL
        if: steps.codeql-default-setup.outputs.enabled != 'true'
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.
          queries: security-extended,security-and-quality

      # Autobuild attempts to build any compiled languages (JS/TS is technically interpreted
      # but this step still helps in preparing the environment).
      - name: Autobuild
        if: steps.codeql-default-setup.outputs.enabled != 'true'
        uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

      - name: Perform CodeQL Analysis
        if: steps.codeql-default-setup.outputs.enabled != 'true'
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: '/language:${{matrix.language}}'

      - name: Skip advanced CodeQL (default setup enabled)
        if: steps.codeql-default-setup.outputs.enabled == 'true'
        run: |
          echo "CodeQL default setup is enabled (state='${{ steps.codeql-default-setup.outputs.state }}')."
          echo "Skipping advanced workflow-based CodeQL to avoid SARIF processing errors."
