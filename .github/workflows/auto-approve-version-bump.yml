name: Auto-approve version bump PRs

on:
  pull_request:
    types: [opened, synchronize]
    branches: [development]

permissions:
  pull-requests: write

jobs:
  # Only run for version bump PRs (title pattern match)
  # Works regardless of whether PR is created by bot or PAT owner
  auto_approve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "startsWith(github.event.pull_request.title, 'chore: bump version to')"

    steps:
      - name: Auto-approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --approve \
            --body "Auto-approving automated version bump PR"

      - name: Wait for checks and auto-merge
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_REPO_TOKEN }}
        run: |
          # Wait a moment for approval to register
          sleep 5

          # Merge the PR (branch auto-deleted by repo settings)
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --merge \
            --body "Auto-merging automated version bump"
