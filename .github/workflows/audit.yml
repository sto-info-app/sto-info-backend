name: npm audit

on:
  pull_request:
    branches:
      - development
      - production
    types: [opened, synchronize, reopened, ready_for_review]

  push:
    branches:
      - development
      - production

  schedule:
    # Run weekly on Sunday at midnight to catch new vulnerabilities
    - cron: '0 0 * * 0'

  workflow_dispatch:

permissions: {}

env:
  NODE_VERSION: 24

jobs:
  check_changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pkg_changed: ${{ steps.filter.outputs.pkg_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            pkg_changed:
              - 'package.json'
              - 'package-lock.json'

  audit:
    name: 'npm audit'
    needs: check_changes
    # Skip for Dependabot
    # Skip draft PRs
    # Skip version bump PRs
    # Run if pkg_changed or push or schedule/dispatch
    if: |
      github.actor != 'dependabot[bot]' &&
      (needs.check_changes.outputs.pkg_changed == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve cache toggle
        id: cache-toggle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          value=$(gh api repos/$REPO/actions/variables/CACHE_NODE_MODULES --jq '.value' 2>/dev/null || echo '')
          if [ -z "$value" ]; then
            value=true
          fi
          echo "use_cache=$value" >> "$GITHUB_OUTPUT"

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies
        with:
          use-cache: ${{ steps.cache-toggle.outputs.use_cache }}
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit (production dependencies)
        run: npm audit --audit-level=high --omit=dev
