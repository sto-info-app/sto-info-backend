name: Sync version with peer repository

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *' # Every day at 22:00 UTC

permissions: {}

env:
  NODE_VERSION: 24.21.0
  PEER_REPO: 'sto-info-app/sto-info-frontend'

concurrency:
  group: version-sync-development
  cancel-in-progress: true

jobs:
  sync_version:
    name: Sync Version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Development
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_REPO_TOKEN || github.token }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Load & cache dependencies
        uses: ./.github/actions/cached-dependencies
        with:
          use-cache: true
          node-version: ${{ env.NODE_VERSION }}

      - name: Check peer version and create PR if higher
        id: sync_pr
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_REPO_TOKEN || github.token }}
        run: |
          # Configure git to use the bot's identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure the labels exist
          gh label create version-sync --color "ededed" --description "Automated version sync" || true
          gh label create chore --color "ededed" --description "Maintenance task" || true

          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          echo "Current version: $CURRENT_VERSION"

          # Fetch peer package.json from development branch
          PEER_VERSION=$(gh api "repos/${PEER_REPO}/contents/package.json?ref=development" --jq '.content' | node -e '
            const fs = require("fs");
            const input = fs.readFileSync(0, "utf-8").trim();
            if (!input) {
              console.error("Failed to retrieve peer package.json");
              process.exit(1);
            }
            const pkg = JSON.parse(Buffer.from(input, "base64").toString("utf-8"));
            if (!pkg.version) {
              console.error("Peer package.json does not contain version");
              process.exit(1);
            }
            console.log(pkg.version);
          ')
          echo "Peer (${PEER_REPO}) version: $PEER_VERSION"

          # Compare versions using semver
          SHOULD_SYNC=$(CURRENT_VERSION="$CURRENT_VERSION" PEER_VERSION="$PEER_VERSION" node -e '
            const current = process.env.CURRENT_VERSION || "";
            const peer = process.env.PEER_VERSION || "";
            function parse(v) {
              const m = v.match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+([0-9A-Za-z.-]+))?$/);
              if (!m) return null;
              return { major: Number(m[1]), minor: Number(m[2]), patch: Number(m[3]), prerelease: m[4] || null };
            }
            function compare(a, b) {
              const pa = parse(a);
              const pb = parse(b);
              if (!pa || !pb) throw new Error(`Invalid semver: ${a} or ${b}`);
              if (pa.major !== pb.major) return pa.major - pb.major;
              if (pa.minor !== pb.minor) return pa.minor - pb.minor;
              if (pa.patch !== pb.patch) return pa.patch - pb.patch;
              if (pa.prerelease && !pb.prerelease) return -1;
              if (!pa.prerelease && pb.prerelease) return 1;
              if (pa.prerelease && pb.prerelease) return pa.prerelease.localeCompare(pb.prerelease);
              return 0;
            }
            console.log(compare(peer, current) > 0 ? "true" : "false");
          ')

          if [ "$SHOULD_SYNC" != "true" ]; then
            echo "Peer version ($PEER_VERSION) is not higher than current version ($CURRENT_VERSION). No sync needed."
            exit 0
          fi

          echo "Peer version ($PEER_VERSION) is higher than current version ($CURRENT_VERSION). Proceeding with version sync."

          BRANCH_NAME="chore/sync-version-to-$PEER_VERSION"

          # Check if a PR already exists for this sync version
          EXISTING_PR_URL=$(gh pr list --repo "${{ github.repository }}" --base development --head "$BRANCH_NAME" --json url --jq '.[0].url' || echo "")

          if [ -n "$EXISTING_PR_URL" ]; then
            echo "PR already exists for version $PEER_VERSION: $EXISTING_PR_URL (no duplicate created)"
            exit 0
          fi

          # Set package version to peer version without creating a git tag
          npm version "$PEER_VERSION" --no-git-tag-version --allow-same-version

          NEW_VERSION="$(node -p "require('./package.json').version")"
          echo "Synced version: $NEW_VERSION"

          # Delete the remote branch if it exists from a previous failed run
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || echo "Branch $BRANCH_NAME does not exist remotely, continuing..."

          # Create the branch
          git checkout -b "$BRANCH_NAME"

          # Commit the changes with DCO sign-off
          git add package.json package-lock.json
          git commit -s -m "chore: sync version to $NEW_VERSION"

          # Push the branch
          git push origin "$BRANCH_NAME"

          # Create a pull request (you approve and merge; no PAT or auto-merge due to branch protection)
          gh pr create \
            --title "chore: sync version to $NEW_VERSION" \
            --body "Automated version sync from $CURRENT_VERSION to match peer repository ($PEER_REPO) version $NEW_VERSION." \
            --label "version-sync,chore" \
            --base development \
            --head "$BRANCH_NAME"
